<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#474E5B"/>
      <stop offset="100%" stop-color="#30353F"/>
    </linearGradient>
    <linearGradient id="top-lit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="bot-shd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#8B98A9"/>
    </linearGradient>
    <filter id="drop-shd" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="cp1">
      <path d="M 142.69 397.78 L 123.08 257.74 A 16 16 0 0 1 151.42 245.53 L 267 390 A 16 16 0 0 1 267 410 L 151.42 554.47 A 16 16 0 0 1 123.08 542.26 L 142.69 402.22 A 16 16 0 0 0 142.69 397.78 Z"/>
    </clipPath>
    <clipPath id="cp2">
      <path d="M 362.69 397.78 L 343.08 257.74 A 16 16 0 0 1 371.42 245.53 L 487 390 A 16 16 0 0 1 487 410 L 371.42 554.47 A 16 16 0 0 1 343.08 542.26 L 362.69 402.22 A 16 16 0 0 0 362.69 397.78 Z"/>
    </clipPath>
    <clipPath id="cp3">
      <path d="M 582.69 397.78 L 563.08 257.74 A 16 16 0 0 1 591.42 245.53 L 707 390 A 16 16 0 0 1 707 410 L 591.42 554.47 A 16 16 0 0 1 563.08 542.26 L 582.69 402.22 A 16 16 0 0 0 582.69 397.78 Z"/>
    </clipPath>
  </defs>

  <!-- Background Canvas (Rounded Squircle) -->
  <rect width="800" height="800" rx="140" fill="url(#brand-bg)"/>

  <!-- Boomerang 1 (Tail) -->
  <g filter="url(#drop-shd)">
    <g clip-path="url(#cp1)">
      <rect x="105" y="190" width="190" height="210" fill="url(#top-lit)"/>
      <rect x="105" y="400" width="190" height="210" fill="url(#bot-shd)"/>
      <line x1="143" y1="400" x2="275" y2="400" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    </g>
  </g>

  <!-- Boomerang 2 (Body) -->
  <g filter="url(#drop-shd)">
    <g clip-path="url(#cp2)">
      <rect x="325" y="190" width="190" height="210" fill="url(#top-lit)"/>
      <rect x="325" y="400" width="190" height="210" fill="url(#bot-shd)"/>
      <line x1="363" y1="400" x2="495" y2="400" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    </g>
  </g>

  <!-- Boomerang 3 (Head) -->
  <g filter="url(#drop-shd)">
    <g clip-path="url(#cp3)">
      <rect x="545" y="190" width="190" height="210" fill="url(#top-lit)"/>
      <rect x="545" y="400" width="190" height="210" fill="url(#bot-shd)"/>
      <line x1="583" y1="400" x2="715" y2="400" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    </g>
  </g>
</svg>
