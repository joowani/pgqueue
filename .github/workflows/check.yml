name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update

      # Restores the dependency builds and the cargo registry, keyed by the toolchain, Cargo.lock and the manifests, so
      # a run rebuilds only this repository's crates. Saved from main alone, whose caches every branch can read, so pull
      # requests do not crowd them out of the repository's cache quota; saved after a failed run too, since a timing
      # flake should not cost the next run its cache.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dev tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit@0.22.2,cargo-llvm-cov@0.9.1,prek@0.5.7

      # The pre-push stage runs every hook, the test suites included, as the prek push hook does locally. `--all-files`
      # hands every tracked file to every hook, so each one runs whatever files it is scoped to. Keep every check in
      # prek.toml, and these tool versions equal to the local ones, so local and CI validation cannot drift apart.
      - name: Run repository checks
        run: prek run --all-files --stage pre-push
