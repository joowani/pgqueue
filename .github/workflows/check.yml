name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --no-self-update

      # Restores the dependency builds and the cargo registry, keyed by the toolchain, Cargo.lock and the manifests, so
      # a run rebuilds only this repository's crates. Saved from main alone, whose caches every branch can read, so pull
      # requests do not crowd them out of the repository's cache quota; saved after a failed run too, since a timing
      # flake should not cost the next run its cache.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dev tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2,cargo-llvm-cov@0.8.7,prek@0.5.5,sqlx-cli@0.9.0

      # This is the same command the prek commit hook runs locally. `--all-files` hands every tracked file to every
      # hook, so each one runs whatever files it is scoped to. GitHub Actions sets `CI`, which makes the test and stress
      # hooks run instead of skipping. Keep every check in prek.toml so local and CI validation cannot drift apart.
      - name: Run repository checks
        run: prek run --all-files
